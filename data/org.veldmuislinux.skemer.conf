<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.veldmuislinux.skemer"/>
  </policy>

  <!-- Any local user may ask for a read-only plan, package search, package
       details, a transaction preview, or repository status. Apply,
       ApplyPackages, SetRepository, SetPacmanOption, and RefreshMirrors are
       authorized by polkit inside the helper. -->
  <policy context="default">
    <allow send_destination="org.veldmuislinux.skemer"/>
    <allow receive_sender="org.veldmuislinux.skemer"/>
  </policy>
</busconfig>
